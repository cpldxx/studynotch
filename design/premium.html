<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mascot candidates, premium set</title>
<meta name="description" content="Eight StudyNotch mascot candidates drawn in a soft, glossy, Apple-like style: academic creatures that breathe, blink and look at you.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@700&family=IBM+Plex+Sans+KR:wght@500&display=swap">
<style>
/* DESIGN.md tokens; the in-between shades are those tokens mixed toward white or ink for light and shadow. */
:root { --paper: #FFFFFF; --desk: #EDF0F3; --ink: #14233B; --graphite: #566173; color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 500 15px/1.5 "IBM Plex Sans KR", -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
main { width: min(1264px, 100%); margin-inline: auto; padding: 48px 24px 72px; }
h1 { margin: 0 0 28px; font: 700 clamp(28px, 3.6vw, 40px)/1.2 "Hahmlet", serif; letter-spacing: -.02em; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin: 0; padding: 0; list-style: none; }
@media (max-width: 1000px) { .grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { main { padding-inline: 16px; } .grid { gap: 10px; } }
.grid li { margin: 0; }
.tile { aspect-ratio: 1; border-radius: 28px; background: radial-gradient(120% 95% at 50% 18%, #FFFFFF 0%, #F4F6F8 45%, #E6EAEF 100%); box-shadow: inset 0 0 0 1px rgba(20, 35, 59, .05); display: grid; place-items: center; overflow: hidden; }
.tile svg { width: 86%; height: 86%; overflow: visible; }
.name { margin: 10px 4px 0; color: var(--graphite); }
.name b { color: var(--ink); margin-right: 6px; }

/* Alive: a slow breath, a blink now and then, eyes that look at the pointer (script below). */
.breathe { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 3.8s ease-in-out infinite; }
@keyframes breathe { 50% { transform: translateY(-2px) scale(1.012, .992); } }
.eyes { transform-box: fill-box; transform-origin: center; animation: blink 5.2s infinite; }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }
.float { animation: float 4.6s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-5px); } }
.grid li:nth-child(2) .breathe, .grid li:nth-child(2) .eyes { animation-delay: -1.1s; }
.grid li:nth-child(3) .breathe, .grid li:nth-child(3) .eyes { animation-delay: -2.3s; }
.grid li:nth-child(4) .breathe, .grid li:nth-child(4) .eyes { animation-delay: -.6s; }
.grid li:nth-child(5) .breathe, .grid li:nth-child(5) .eyes { animation-delay: -3.1s; }
.grid li:nth-child(6) .breathe, .grid li:nth-child(6) .eyes { animation-delay: -1.7s; }
.grid li:nth-child(7) .breathe, .grid li:nth-child(7) .eyes { animation-delay: -2.8s; }
.grid li:nth-child(8) .breathe, .grid li:nth-child(8) .eyes { animation-delay: -.3s; }
@media (prefers-reduced-motion: reduce) { .breathe, .eyes, .float { animation: none; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="b2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="b4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <radialGradient id="ink" cx="34%" cy="26%" r="82%"><stop offset="0" stop-color="#4A5F86"/><stop offset=".45" stop-color="#22355A"/><stop offset="1" stop-color="#0E1A2E"/></radialGradient>
    <radialGradient id="paper" cx="38%" cy="28%" r="85%"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#F3F5F8"/><stop offset="1" stop-color="#DDE2EA"/></radialGradient>
    <radialGradient id="yellow" cx="34%" cy="28%" r="80%"><stop offset="0" stop-color="#FFF8C2"/><stop offset=".45" stop-color="#FFE94A"/><stop offset="1" stop-color="#D6C13F"/></radialGradient>
    <radialGradient id="pen" cx="36%" cy="48%" r="75%"><stop offset="0" stop-color="#7396F8"/><stop offset=".5" stop-color="#1F4FD8"/><stop offset="1" stop-color="#132F82"/></radialGradient>
    <radialGradient id="peri" cx="34%" cy="26%" r="82%"><stop offset="0" stop-color="#EEF1FF"/><stop offset=".5" stop-color="#A5B4FF"/><stop offset="1" stop-color="#6271C2"/></radialGradient>
    <radialGradient id="ember" cx="44%" cy="38%" r="72%"><stop offset="0" stop-color="#FFFEF4"/><stop offset=".45" stop-color="#FFF4A6"/><stop offset="1" stop-color="#FFE94A"/></radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFE94A" stop-opacity=".75"/><stop offset=".45" stop-color="#FFE94A" stop-opacity=".25"/><stop offset="1" stop-color="#FFE94A" stop-opacity="0"/></radialGradient>
    <linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#FFF5A8"/><stop offset=".35" stop-color="#FFE94A"/><stop offset="1" stop-color="#D2BE3E"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#D5DBE3"/><stop offset="1" stop-color="#8E939C"/></linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E4E8EE"/></linearGradient>
    <!-- Eyes: dark ones for light bodies, white ones for dark bodies. -->
    <g id="eye"><ellipse rx="6.6" ry="8.6" fill="#14233B"/><circle cx="2.3" cy="-3.3" r="2.4" fill="#fff"/><circle cx="-2.2" cy="3.6" r="1.1" fill="#fff" opacity=".55"/></g>
    <g id="eyeW"><ellipse rx="7.6" ry="9.2" fill="#fff"/><circle cx="1" cy="1.6" r="4.7" fill="#14233B"/><circle cx="2.7" cy="-.6" r="1.7" fill="#fff"/></g>
    <path id="smile" d="M-6 0 Q0 5.5 6 0" fill="none" stroke="#14233B" stroke-width="2.4" stroke-linecap="round"/>
    <path id="smileW" d="M-6 0 Q0 5.5 6 0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    <ellipse id="cheek" rx="6.5" ry="3.6" fill="#FF9EC4" opacity=".55" filter="url(#b2)"/>
  </defs>
</svg>

</main>

<script>
(function () {
  'use strict';
  // The eyes look toward the pointer, a few units at most, like the app's mascot.
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var looks = Array.prototype.slice.call(document.querySelectorAll('.look'));
  var frame = 0, px = 0, py = 0;
  window.addEventListener('pointermove', function (e) {
    px = e.clientX; py = e.clientY;
    if (!frame) frame = requestAnimationFrame(apply);
  }, { passive: true });
  function apply() {
    frame = 0;
    looks.forEach(function (g) {
      var svg = g.ownerSVGElement, r = svg.getBoundingClientRect();
      var dx = (px - (r.left + r.width / 2)) / 260, dy = (py - (r.top + r.height / 2)) / 260;
      var d = Math.hypot(dx, dy), k = d > 1 ? 1 / d : 1;
      g.setAttribute('transform', 'translate(' + (dx * k * 3.2).toFixed(2) + ' ' + (dy * k * 2.6).toFixed(2) + ')');
    });
  }
})();
</script>
</body>
</html>
