<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squat</title>
<meta name="description" content="The Squat droplet in glossy black. Its eyes change colour with the study state. WebGL, no libraries.">
<style>
  :root { --paper: #FFFFFF; --desk: #EDF0F3; --ink: #14233B; --graphite: #566173; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 40px 16px 48px; background: var(--paper); color: var(--ink);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; display: grid; gap: 16px; }
  h1 { margin: 0 0 8px; font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }
  .top { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
  .hero { width: 100%; aspect-ratio: 1; display: block; border-radius: 24px; background: #000; }
  .side { display: grid; gap: 16px; align-content: start; }
  .light { width: 100%; aspect-ratio: 1; display: block; border-radius: 24px; background: var(--desk); }
  .pick { display: flex; flex-wrap: wrap; gap: 6px; }
  .pick button { font: inherit; font-size: 13px; border: 0; border-radius: 999px; padding: 7px 12px; background: var(--desk); color: var(--ink); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .pick button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .pick i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .pick button:focus-visible { outline: 2px solid #1F4FD8; outline-offset: 2px; }
  .states { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; }
  .states figure { margin: 0; display: grid; justify-items: center; gap: 4px; }
  .states canvas { width: 100%; aspect-ratio: 1; display: block; border-radius: 14px; background: #000; }
  .states figcaption { font-size: 12px; color: var(--graphite); }
  .island { background: #000; border-radius: 0 0 18px 18px; height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 26px; max-width: 520px; }
  .island canvas { width: 26px; height: 26px; display: block; }
  .island .ears { display: flex; gap: 10px; }
  @media (max-width: 820px) { .top { grid-template-columns: minmax(0, 1fr); } .states { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
</style>
</head>
<body>
<main>
  <h1>Squat</h1>
  <div class="top">
    <canvas class="hero" id="hero" width="900" height="900" role="img" aria-label="Squat, live"></canvas>
    <div class="side">
      <div class="pick" id="pick" aria-label="State"></div>
      <canvas class="light" id="light" width="600" height="600" role="img" aria-label="Squat on a light page"></canvas>
    </div>
  </div>
  <div class="states" id="states"></div>
  <div class="island" id="island" aria-label="Squat at notch size"></div>
</main>
<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes;
uniform vec3 uCam;
uniform vec3 uTarget;
uniform float uAA;
uniform float uLight;   // 0 on black, 1 on a light page
uniform vec3 uEyeCol;   // sRGB
uniform vec4 uEye;      // open, shape (0 open, 1 smile, 2 closed), look x, look y
uniform vec4 uBody;     // lean, squash, tip bend, blink
uniform vec2 uEyeR;     // oval half-width and half-height
uniform vec2 uCut;      // eyelid line: height (in eye heights) and slope; slope < 0 sad, > 0 angry

float smin(float a, float b, float k) { float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0); return mix(b, a, h) - k * h * (1.0 - h); }
float sdEllipsoid(vec3 p, vec3 r) { float k0 = length(p / r); float k1 = length(p / (r * r)); return k0 * (k0 - 1.0) / k1; }
float sdRoundCone(vec3 p, vec3 a, vec3 b, float r1, float r2) {
  vec3 ba = b - a; float l2 = dot(ba, ba), rr = r1 - r2, a2 = l2 - rr * rr, il2 = 1.0 / l2;
  vec3 pa = p - a; float y = dot(pa, ba), z = y - l2;
  vec3 xv = pa * l2 - ba * y; float x2 = dot(xv, xv), y2 = y * y * l2, z2 = z * z * l2;
  float k = sign(rr) * rr * rr * x2;
  if (sign(z) * a2 * z2 > k) return sqrt(x2 + z2) * il2 - r2;
  if (sign(y) * a2 * y2 < k) return sqrt(x2 + y2) * il2 - r1;
  return (sqrt(x2 * a2 * il2) + y * rr) * il2 - r1;
}
mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
vec3 bodySpace(vec3 p) { p.xy = rot(uBody.x) * p.xy; p.y /= uBody.y; return p; }

const float R = 0.46, C = 0.40;
float body(vec3 p) {
  float d = sdRoundCone(p, vec3(0.0, C, 0.0), vec3(-0.10 + uBody.z * 0.22, 0.88, -0.06), R, 0.04);
  d = smin(d, sdEllipsoid(p - vec3(-0.17, 0.05, 0.22), vec3(0.10, 0.065, 0.11)), 0.07);
  d = smin(d, sdEllipsoid(p - vec3(0.17, 0.05, 0.22), vec3(0.10, 0.065, 0.11)), 0.07);
  return d;
}
// The eyes are painted on the surface: worked out in a flat face plane that looks at the camera,
// so they stay perfect, upright ovals however the body curves.
vec2 facePlane(vec3 b) {
  vec3 F = vec3(sin(uCam.x), 0.0, cos(uCam.x));
  vec3 right = vec3(F.z, 0.0, -F.x);
  vec3 o = b - vec3(0.0, C, 0.0);
  return vec2(dot(o, right), o.y);
}
// A thick curved line: the part of a circle on one side (dir) of the height cutY.
float arcLine(vec2 q, vec2 c, float r, float cutY, float dir) {
  vec2 v = q - c;
  float y0 = cutY - c.y, ex = sqrt(max(r * r - y0 * y0, 0.0));
  if (dir * (v.y - y0) > 0.0) return abs(length(v) - r);
  return min(length(v - vec2(ex, y0)), length(v - vec2(-ex, y0)));
}
// An arc that is thick in the middle and narrows to fine points at both ends: up = 1 arch (∩), -1 dip (∪).
float taperArc(vec2 q, vec2 c, float r, float halfAng, float th, float up) {
  vec2 v = q - c; v.y *= up;
  float a = clamp(atan(v.x, v.y), -halfAng, halfAng);
  vec2 p = r * vec2(sin(a), cos(a));
  float w = th * mix(1.0, 0.16, pow(abs(a) / halfAng, 1.6));
  return length(v - p) - w;
}
// Signed distance (in face units) to the nearest eye; negative inside.
float eyeDist(vec2 f) {
  float d = 1e5;
  for (int i = 0; i < 2; i++) {
    float s = i == 0 ? -1.0 : 1.0;
    vec2 c = vec2(s * 0.17 + uEye.z * 0.06, 0.09 + uEye.w * 0.045);
    vec2 q = f - c;
    float e;
    if (uEye.y < 0.5) {
      vec2 r = vec2(uEyeR.x, uEyeR.y * max(uEye.x * (1.0 - uBody.w), 0.06));
      e = (length(q / r) - 1.0) * min(r.x, r.y);
      // An eyelid line cuts the top: lower at the outer corner looks sad, lower at the inner corner looks cross.
      float xo = s * q.x;
      e = max(e, (q.y - (uCut.x * r.y + uCut.y * xo)) / sqrt(1.0 + uCut.y * uCut.y));
    } else if (uEye.y < 1.5) {
      e = taperArc(q / vec2(1.15, 1.85), vec2(0.0, -0.04), 0.066, 1.22, 0.019, 1.0) * 1.15;   // smile: a long arch with fine ends
    } else {
      e = taperArc(q, vec2(0.0, 0.058), 0.086, 0.8, 0.021, -1.0);   // asleep: a shallow dip with fine ends
    }
    d = min(d, e);
  }
  return d;
}
vec3 map(vec3 p) {
  vec3 b = bodySpace(p);
  float bd = body(b) * min(uBody.y, 1.0);
  vec3 r = vec3(bd, 1.0, 0.0);
  if (p.y < r.x) r.xy = vec2(p.y, 5.0);
  return r;
}
vec3 normal(vec3 p) {
  vec2 e = vec2(0.0006, 0.0);
  return normalize(vec3(map(p + e.xyy).x - map(p - e.xyy).x, map(p + e.yxy).x - map(p - e.yxy).x, map(p + e.yyx).x - map(p - e.yyx).x));
}
float shadow(vec3 ro, vec3 rd) {
  float res = 1.0, t = 0.02;
  for (int i = 0; i < 56; i++) { float h = map(ro + rd * t).x; res = min(res, 5.0 * h / t); t += clamp(h, 0.008, 0.12); if (res < 0.002 || t > 3.0) break; }
  return clamp(res, 0.0, 1.0);
}
float occlusion(vec3 p, vec3 n) {
  float occ = 0.0, sca = 1.0;
  for (int i = 0; i < 6; i++) { float h = 0.012 + 0.15 * float(i) / 5.0; occ += (h - map(p + h * n).x) * sca; sca *= 0.86; }
  return clamp(1.0 - 2.2 * occ, 0.0, 1.0);
}
// The studio the black coat reflects: a big softbox up left, a strip behind on the right, a faint floor bounce.
vec3 studio(vec3 r) {
  vec3 c = mix(vec3(0.01), mix(vec3(0.02), vec3(0.25, 0.26, 0.28), uLight), smoothstep(-0.3, 0.7, r.y));
  c += vec3(5.0, 4.9, 4.7) * smoothstep(0.84, 0.95, dot(r, normalize(vec3(-0.6, 0.7, 0.4))));
  c += vec3(1.6, 1.8, 2.2) * smoothstep(0.90, 0.985, dot(r, normalize(vec3(0.85, 0.35, -0.4))));
  c += vec3(0.6) * smoothstep(0.93, 0.99, dot(r, normalize(vec3(0.2, 0.15, 1.0))));
  return c;
}
vec3 toLin(vec3 c) { return pow(c, vec3(2.2)); }
vec3 aces(vec3 x) { return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }

vec3 render(vec2 frag) {
  vec2 uv = (2.0 * frag - uRes) / uRes.y;
  vec3 ro = uTarget + uCam.z * vec3(sin(uCam.x) * cos(uCam.y), sin(uCam.y), cos(uCam.x) * cos(uCam.y));
  vec3 fw = normalize(uTarget - ro), rt = normalize(cross(fw, vec3(0, 1, 0))), up = cross(rt, fw);
  vec3 rd = normalize(fw * 3.4 + uv.x * rt + uv.y * up);
  float t = 0.0; vec3 h = vec3(0.0); bool hit = false;
  for (int i = 0; i < 160; i++) {
    h = map(ro + rd * t);
    if (abs(h.x) < 0.0004 * t) { hit = true; break; }
    t += h.x * 0.8;
    if (t > 20.0) break;
  }
  vec3 eyeLin = toLin(uEyeCol);
  float glow = 0.0;
  vec3 bgLin = uLight > 0.5 ? toLin(vec3(0.929, 0.941, 0.953)) : vec3(0.0);
  if (!hit || h.y > 4.5) {
    vec3 c = bgLin;
    if (hit) {
      vec3 p = ro + rd * t;
      float sh = shadow(p + vec3(0, 0.003, 0), normalize(vec3(-0.3, 1.0, 0.35)));
      float occ = occlusion(p, vec3(0, 1, 0));
      float fade = 1.0 - smoothstep(0.4, 1.5, length(p.xz - uTarget.xz));
      c *= 1.0 - (0.3 * (1.0 - sh) + 0.6 * (1.0 - occ)) * fade;
      float pool = exp(-length((p.xz - vec2(0.0, 0.45)) * vec2(1.6, 2.4)) * 3.0) * 0.1;
      c += eyeLin * pool * occ;
    }
    if (uLight > 0.5) {
      float shade = 1.0;
      if (hit) {
        vec3 p = ro + rd * t;
        float sh = shadow(p + vec3(0, 0.003, 0), normalize(vec3(-0.3, 1.0, 0.35)));
        float occ = occlusion(p, vec3(0, 1, 0));
        float fade = 1.0 - smoothstep(0.4, 1.5, length(p.xz - uTarget.xz));
        shade = 1.0 - (0.22 * (1.0 - sh) + 0.5 * (1.0 - occ)) * fade;
      }
      return vec3(0.929, 0.941, 0.953) * shade + uEyeCol * glow * 0.6;
    }
    c += eyeLin * glow;
    // On black the light from the eyes fades out before the edge, so a small picture has no visible square.
    c *= 1.0 - smoothstep(0.7, 1.0, max(abs(uv.x), abs(uv.y)));
    return pow(aces(c), vec3(1.0 / 2.2));
  }
  vec3 p = ro + rd * t, n = normal(p);
  vec3 L = normalize(vec3(-0.45, 0.9, 0.5));
  float sh = shadow(p + n * 0.003, L);
  float occ = occlusion(p, n);
  float fre = pow(clamp(1.0 + dot(n, rd), 0.0, 1.0), 4.0);
  vec3 col;
  if (h.y < 1.5) {
    // Glossy black: almost all of what you see is the reflection of the studio and the light from the eyes.
    vec3 b = bodySpace(p);
    float g = smoothstep(0.0, 1.0, b.y);
    vec3 alb = mix(toLin(vec3(0.035, 0.038, 0.045)), toLin(vec3(0.11, 0.12, 0.14)), g);
    float dif = clamp(dot(n, L), 0.0, 1.0) * mix(1.0, sh, 0.85);
    col = alb * (1.2 * dif + 0.25 * occ);
    vec3 rimL = normalize(vec3(0.8, 0.3, -0.6));
    col += vec3(0.35, 0.42, 0.55) * pow(clamp(1.0 + dot(n, rd), 0.0, 1.0), 2.2) * clamp(dot(n, rimL) + 0.45, 0.0, 1.0) * occ;
    vec2 fp = facePlane(b);
    float front = smoothstep(0.1, 0.4, dot(n, vec3(sin(uCam.x), 0.0, cos(uCam.x))));
    float ed = eyeDist(fp);
    float mask = (1.0 - smoothstep(-0.0025, 0.0025, ed)) * front;
    col += eyeLin * exp(-max(ed, 0.0) * 28.0) * 0.1 * front;    // the eyes light the face around them
    col = mix(col, eyeLin * 1.15, mask);
    col += eyeLin * 0.05 * smoothstep(0.35, 0.0, b.y) * occ;     // and a little of their colour sinks to the bottom
    vec3 hal = normalize(L - rd);
    col += pow(clamp(dot(n, hal), 0.0, 1.0), 180.0) * 1.4 * sh;
    col = mix(col, studio(reflect(rd, n)) * occ, (0.045 + 0.85 * fre) * (1.0 - mask * 0.7));
  }
  col += eyeLin * glow * 0.5;
  return pow(aces(col), vec3(1.0 / 2.2));
}

void main() {
  vec3 c = vec3(0.0);
  if (uAA > 1.5) {
    for (int j = 0; j < 2; j++) for (int i = 0; i < 2; i++) c += render(gl_FragCoord.xy + (vec2(float(i), float(j)) - 0.5) * 0.5);
    c /= 4.0;
  } else c = render(gl_FragCoord.xy);
  gl_FragColor = vec4(c, 1.0);
}
</script>
<script>
// State colours from DESIGN.md. Idle eyes are Island Text white.
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
const STATES = {
  idle:    { label: 'Idle',    col: '#F5F6F8', eye: [1, 0, 0, 0],       body: [0, 1, 0] },
  focus:   { label: 'Focus',   col: '#7CE38B', eye: [0.42, 0, 0, -0.7], body: [0, 0.97, 0] },
  writing: { label: 'Writing', col: '#C9A6FF', eye: [0.9, 0, 0.9, 0.8], body: [-0.06, 1, -0.6] },
  drift:   { label: 'Drift',   col: '#FFB25E', eye: [1.15, 0, -1, 0.2], body: [0.09, 1, 0.7] },
  break:   { label: 'Break',   col: '#F5F6F8', eye: [1, 2, 0, -0.3],    body: [0, 0.9, 0.9] },
  done:    { label: 'Done',    col: '#7CE38B', eye: [1, 1, 0, 0.2],     body: [0, 1.04, -0.35] },
  sad:     { label: 'Sad',     col: '#7CC8FF', eye: [0.95, 0, 0, -0.6], body: [0, 0.94, 1.0], cut: [0.15, -0.9], long: true },
  angry:   { label: 'Angry',   col: '#FF6B6B', eye: [0.9, 0, 0, 0],     body: [0.0, 1.0, -0.5], cut: [0.2, 1.1], long: true },
};
const NAMES = Object.keys(STATES);
const CAM = [0.42, 0.22, 3.5], TARGET = [0.0, 0.46, 0];

const gl = document.createElement('canvas').getContext('webgl', { preserveDrawingBuffer: true, antialias: false });
const prog = (() => {
  const vs = gl.createShader(gl.VERTEX_SHADER); gl.shaderSource(vs, 'attribute vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }'); gl.compileShader(vs);
  const fs = gl.createShader(gl.FRAGMENT_SHADER); gl.shaderSource(fs, document.getElementById('fs').textContent); gl.compileShader(fs);
  if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(fs));
  const p = gl.createProgram(); gl.attachShader(p, vs); gl.attachShader(p, fs); gl.linkProgram(p); gl.useProgram(p);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const a = gl.getAttribLocation(p, 'a'); gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
  return p;
})();
const U = {}; ['uRes', 'uCam', 'uTarget', 'uAA', 'uLight', 'uEyeCol', 'uEye', 'uBody', 'uCut', 'uEyeR'].forEach(n => U[n] = gl.getUniformLocation(prog, n));
// v: { col: [r,g,b], eye: [open, shape, lx, ly], body: [lean, squash, tip], blink }
function draw(target, v, opt = {}) {
  const size = target.width;
  gl.canvas.width = gl.canvas.height = size; gl.viewport(0, 0, size, size);
  gl.uniform2f(U.uRes, size, size);
  gl.uniform3f(U.uCam, CAM[0], CAM[1], CAM[2] / (opt.zoom || 1));
  gl.uniform3f(U.uTarget, ...TARGET);
  gl.uniform1f(U.uAA, opt.aa || 2);
  gl.uniform1f(U.uLight, opt.light ? 1 : 0);
  gl.uniform3f(U.uEyeCol, ...v.col);
  gl.uniform4f(U.uEye, ...v.eye);
  gl.uniform4f(U.uBody, ...v.body, v.blink || 0);
  gl.uniform2f(U.uCut, ...(v.cut || [2, 0]));
  gl.uniform2f(U.uEyeR, ...(v.r || EYE_R));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  target.getContext('2d').drawImage(gl.canvas, 0, 0);
}
const EYE_R = [0.075, 0.132], EYE_R_LONG = [0.07, 0.15];
const eyeR = name => (STATES[name].long ? EYE_R_LONG : EYE_R).slice();
const still = name => ({ col: hex(STATES[name].col), eye: STATES[name].eye.slice(), body: STATES[name].body.slice(), cut: (STATES[name].cut || [2, 0]).slice(), r: eyeR(name), blink: 0 });
const canvas = px => { const c = document.createElement('canvas'); c.width = c.height = px; return c; };

// Still pictures of every state, and the notch strip.
const statesEl = document.getElementById('states'), island = document.getElementById('island');
NAMES.forEach(n => {
  const f = document.createElement('figure'), c = canvas(260);
  c.setAttribute('role', 'img'); c.setAttribute('aria-label', `Squat, ${STATES[n].label}`);
  f.append(c); f.insertAdjacentHTML('beforeend', `<figcaption>${STATES[n].label}</figcaption>`); statesEl.append(f);
  draw(c, still(n));
});
const first = canvas(52); draw(first, still('idle'), { zoom: 1.75 }); island.append(first);
const ears = document.createElement('div'); ears.className = 'ears';
NAMES.forEach(n => { const c = canvas(52); draw(c, still(n), { zoom: 1.75 }); ears.append(c); });
island.append(ears);

// The live one: pick a state, or let it go through them on its own. Colour and pose ease across; the eye
// shape (open, smile, closed) swaps while it blinks, so nothing pops.
const hero = document.getElementById('hero'), light = document.getElementById('light'), pick = document.getElementById('pick');
const startName = new URLSearchParams(location.search).get('state') || 'idle';
let target = STATES[startName] ? startName : 'idle', auto = !STATES[new URLSearchParams(location.search).get('state')];
const cur = still(target);
NAMES.forEach(n => {
  const b = document.createElement('button');
  b.innerHTML = `<i style="background:${STATES[n].col};box-shadow:inset 0 0 0 1px rgba(20,35,59,.18)"></i>${STATES[n].label}`;
  b.setAttribute('aria-pressed', n === target);
  b.onclick = () => { auto = false; setState(n); };
  pick.append(b);
});
function setState(n) {
  target = n;
  [...pick.children].forEach((b, i) => b.setAttribute('aria-pressed', NAMES[i] === n));
}
draw(hero, cur); draw(light, cur, { light: true });

if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
  let last = 0, nextAuto = performance.now() + 3200, nextBlink = performance.now() + 2000, blinkStart = -1, glance = 0, glanceT = 0, nextGlance = performance.now() + 2500, tipV = 0;
  const tick = now => {
    requestAnimationFrame(tick);
    if (now - last < 33 || document.hidden) return;
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (auto && now > nextAuto) { setState(NAMES[(NAMES.indexOf(target) + 1) % NAMES.length]); nextAuto = now + 3200; }
    const goal = STATES[target];
    // Blink: on its own every few seconds, and always when the eye shape has to change.
    if (goal.eye[1] !== cur.eye[1] && blinkStart < 0) blinkStart = now;
    if (blinkStart < 0 && now > nextBlink && cur.eye[1] === 0) { blinkStart = now; nextBlink = now + 2200 + Math.random() * 4000; }
    let blink = 0;
    if (blinkStart >= 0) {
      const u = (now - blinkStart) / 180;
      blink = u < 0.5 ? u * 2 : Math.max(0, 2 - u * 2);
      if (u >= 0.5) cur.eye[1] = goal.eye[1];
      if (u >= 1) blinkStart = -1;
    }
    if (now > nextGlance) { glanceT = Math.random() < 0.4 ? 0 : (Math.random() * 1.2 - 0.6); nextGlance = now + 1500 + Math.random() * 3000; }
    glance += (glanceT - glance) * Math.min(1, dt * 6);
    const k = Math.min(1, dt * 5);
    const gc = hex(goal.col);
    for (let i = 0; i < 3; i++) cur.col[i] += (gc[i] - cur.col[i]) * k;
    cur.eye[0] += (goal.eye[0] - cur.eye[0]) * k;
    cur.eye[2] += (goal.eye[2] + (target === 'idle' ? glance : 0) - cur.eye[2]) * k;
    cur.eye[3] += (goal.eye[3] - cur.eye[3]) * k;
    cur.body[0] += (goal.body[0] - cur.body[0]) * k;
    cur.body[1] += (goal.body[1] - cur.body[1]) * k;
    const gcut = goal.cut || [2, 0];
    cur.cut[0] += (gcut[0] - cur.cut[0]) * k; cur.cut[1] += (gcut[1] - cur.cut[1]) * k;
    const gr = eyeR(target); cur.r[0] += (gr[0] - cur.r[0]) * k; cur.r[1] += (gr[1] - cur.r[1]) * k;
    // The tip lags behind with a spring, so it sways after every move.
    tipV += ((goal.body[2] - cur.eye[2] * 0.3) - cur.body[2]) * dt * 30 - tipV * dt * 6;
    cur.body[2] += tipV * dt;
    cur.blink = cur.eye[1] === 0 ? blink : 0;
    draw(hero, cur, { aa: 1 });
    draw(light, cur, { aa: 1, light: true });
  };
  requestAnimationFrame(tick);
}
</script>
