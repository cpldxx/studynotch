<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mascot checks</title>
<style>
  :root { --paper: #FFFFFF; --desk: #EDF0F3; --ink: #14233B; --graphite: #566173; }
  body { margin: 0; padding: 24px 16px; background: var(--paper); color: var(--ink);
    font: 12px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; }
  section { max-width: 1240px; margin: 0 auto 28px; display: grid; gap: 10px; }
  h2 { margin: 0; font-size: 16px; }
  .row { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
  .tile { background: var(--desk); border-radius: 10px; padding: 8px; display: grid; justify-items: center; gap: 4px; }
  .tile.black { background: #000; color: #8E939C; }
  .tile svg { display: block; }
  .ear { background: #000; border-radius: 0 0 14px 14px; height: 32px; width: 300px; display: flex; align-items: center;
    justify-content: space-between; padding: 0 30px; box-sizing: border-box; }
  .ear svg { width: 20px; height: 20px; }
  .squint svg { filter: blur(1.6px); } .mono svg { filter: brightness(0); } .white svg { filter: brightness(0) invert(1); }
</style>
</head>
<body>
<div id="out"></div>
<script src="mascots.js"></script>
<script>
const M = window.Mascots, out = document.getElementById('out');
const sized = (s, px) => s.replace('<svg ', `<svg width="${px}" height="${px}" `);
// A stand-in for the mascot we must not resemble: a squircle with two big white eyes.
const stand = `<svg viewBox="0 0 20 20" width="20" height="20"><rect x="2.5" y="3" width="15" height="14" rx="5.5" fill="#F5F6F8"/><circle cx="7.5" cy="9.5" r="2.4" fill="#000"/><circle cx="12.5" cy="9.5" r="2.4" fill="#000"/><circle cx="7.5" cy="9.5" r="1.4" fill="#fff"/><circle cx="12.5" cy="9.5" r="1.4" fill="#fff"/></svg>`;
for (const m of M.list) {
  let h = `<section><h2>${m.name}</h2><div class="row">`;
  h += `<div class="tile">${sized(M.large(m, 'idle'), 256)}</div>`;
  for (const s of M.STATES) h += `<div class="tile">${sized(M.large(m, s), 112)}<span>${s}</span></div>`;
  h += `</div><div class="row">`;
  for (const s of M.STATES) h += `<div class="tile black">${sized(M.small(m, s), 20)}${sized(M.small(m, s), 40)}<span>${s}</span></div>`;
  for (const s of M.STATES) h += `<div class="tile">${sized(M.small(m, s), 20)}</div>`;
  h += `<div class="tile black"><div class="ear">${sized(M.small(m, 'idle'), 20)}${stand}</div><span>20 pt ear, stand-in on the right</span></div>`;
  h += `</div><div class="row">`;
  for (const px of [16, 20]) h += `<div class="tile">${sized(M.small(m, 'idle'), px)}<span>${px}</span></div>`;
  for (const px of [32, 64, 128]) h += `<div class="tile">${sized(M.large(m, 'idle'), px)}<span>${px}</span></div>`;
  h += `<div class="tile squint">${sized(M.large(m, 'idle'), 64)}<span>squint</span></div>`;
  h += `<div class="tile mono">${sized(M.large(m, 'idle'), 64)}${sized(M.small(m, 'idle'), 20)}<span>one colour</span></div>`;
  h += `<div class="tile black white">${sized(M.large(m, 'idle'), 64)}${sized(M.small(m, 'idle'), 20)}<span>reversed</span></div>`;
  h += `<div class="tile" style="filter:grayscale(1)">${sized(M.large(m, 'idle'), 64)}<span>grey</span></div>`;
  out.insertAdjacentHTML('beforeend', h + '</div></section>');
}
window.exportAll = () => { const o = {}; for (const m of M.list) for (const s of M.STATES) { o[`${m.id}-${s}-large.svg`] = M.large(m, s); o[`${m.id}-${s}-20.svg`] = M.small(m, s); } return o; };
</script>
</body>
</html>
