<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cut-out mascots</title>
<meta name="description" content="Six mascot candidates: one flat shape each, eyes cut out of it, no mouth. Shapes come from the study desk.">
<style>
  :root { --paper: #FFFFFF; --desk: #EDF0F3; --ink: #14233B; --graphite: #566173; --hi: #FFE94A; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 40px 16px 48px; background: var(--paper); color: var(--ink);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; }
  h1 { max-width: 1200px; margin: 0 auto 24px; font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }
  .grid { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  article { background: var(--desk); border-radius: 24px; padding: 18px; display: grid; gap: 12px; }
  h2 { margin: 0; font-size: 17px; font-weight: 600; display: flex; gap: 10px; align-items: baseline; }
  h2 span { color: var(--graphite); font-weight: 500; }
  .stage { background: #000; border-radius: 18px; display: grid; place-items: center; aspect-ratio: 1.5; cursor: pointer; }
  .stage svg { width: 46%; height: auto; display: block; overflow: visible; }
  .states { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .states figure { margin: 0; display: grid; justify-items: center; gap: 3px; }
  .states .tile { width: 100%; aspect-ratio: 1; background: #000; border-radius: 10px; display: grid; place-items: center; }
  .states .tile.light { background: var(--paper); }
  .states svg { width: 62%; height: auto; display: block; overflow: visible; }
  .states figcaption { font-size: 11px; color: var(--graphite); }
  .island { background: #000; border-radius: 0 0 16px 16px; height: 34px; display: flex; align-items: center; justify-content: space-between; padding: 0 26px; }
  .island svg { height: 20px; display: block; overflow: visible; }
  .island .ears { display: flex; gap: 12px; }
  @media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr); max-width: 460px; } }
</style>
</head>
<body>
<h1>Mascot candidates</h1>
<div class="grid" id="grid"></div>
<script>
// One flat shape in Highlighter yellow, eyes cut out of it (they show whatever is behind), no mouth.
// Every shape comes from the desk: a highlighter stroke, a dog-eared page, a bookmark, a page flag, a folded note, the notch.
const HI = '#FFE94A';
const STATES = ['idle', 'focus', 'writing', 'drift', 'break'];
const f = n => +n.toFixed(2);

// A polygon with rounded corners (radius per corner or one radius for all).
function rounded(pts, r) {
  const rs = Array.isArray(r) ? r : pts.map(() => r);
  let d = '';
  pts.forEach((p, i) => {
    const a = pts[(i - 1 + pts.length) % pts.length], b = pts[(i + 1) % pts.length];
    const la = Math.hypot(a[0] - p[0], a[1] - p[1]), lb = Math.hypot(b[0] - p[0], b[1] - p[1]);
    const k = Math.min(rs[i], la / 2, lb / 2);
    const p1 = [p[0] + (a[0] - p[0]) * k / la, p[1] + (a[1] - p[1]) * k / la];
    const p2 = [p[0] + (b[0] - p[0]) * k / lb, p[1] + (b[1] - p[1]) * k / lb];
    d += (i ? ' L' : 'M') + f(p1[0]) + ' ' + f(p1[1]) + ` Q${f(p[0])} ${f(p[1])} ${f(p2[0])} ${f(p2[1])}`;
  });
  return d + ' Z';
}

// Bodies in a 100 × 100 box. `eyes` is the point between the eyes; `gap` the distance between them.
const BODIES = [
  { name: 'Chisel', d: rounded([[12, 30], [76, 30], [90, 70], [26, 70]], 9), eyes: [52, 48], gap: 17, size: [8, 15] },
  { name: 'Dog-ear', d: rounded([[22, 12], [56, 12], [78, 34], [78, 88], [22, 88]], [9, 3, 3, 9, 9]),
    extra: rounded([[60, 12], [78, 30], [60, 30]], [3, 3, 4]), eyes: [48, 52], gap: 17, size: [8, 15] },
  { name: 'Bookmark', d: rounded([[28, 8], [72, 8], [72, 92], [50, 76], [28, 92]], [8, 8, 4, 6, 4]), eyes: [50, 40], gap: 16, size: [8, 15] },
  { name: 'Flag', d: 'M18 30 Q14 30 14 34 V66 Q14 70 18 70 H66 A20 20 0 0 0 66 30 Z', eyes: [52, 50], gap: 17, size: [8, 15] },
  { name: 'Fold', d: rounded([[10, 36], [36, 24], [64, 36], [90, 24], [90, 66], [64, 78], [36, 66], [10, 78]], 6), eyes: [50, 50], gap: 18, size: [8, 14] },
  { name: 'Notch', d: 'M4 26 Q14 26 14 34 V60 Q14 76 30 76 H70 Q86 76 86 60 V34 Q86 26 96 26 Z', eyes: [50, 49], gap: 18, size: [8, 15] },
];

// States are numbers: eye height, where the eyes look, and how the body leans or settles.
const POSE = {
  idle:    { open: 1,    look: [0, 0],   rot: 0,  sy: 1,    ty: 0 },
  focus:   { open: 0.42, look: [0, 2.5], rot: 0,  sy: 0.96, ty: 1.5 },
  writing: { open: 0.85, look: [5, -3],  rot: -4, sy: 1,    ty: 0 },
  drift:   { open: 1.15, look: [-6, -1], rot: 6,  sy: 1,    ty: 0 },
  break:   { open: 0,    look: [0, 3],   rot: 0,  sy: 0.88, ty: 6 },
};

let uid = 0;
// Draws one mascot. `yaw` turns the face a little, as if the shape were a solid turning its head.
function mascot(b, pose, opt = {}) {
  const id = 'm' + (uid++);
  const blink = opt.blink || 0, yaw = opt.yaw == null ? pose.look[0] / 6 : opt.yaw;
  const [cx, cy] = b.eyes, [w, h0] = b.size;
  const lx = pose.look[0] + yaw * 2, ly = pose.look[1];
  const squeeze = 1 - Math.abs(yaw) * 0.16;
  let eyes = '';
  [-1, 1].forEach(s => {
    // The eye on the far side gets narrower when the face turns.
    const far = Math.sign(yaw) === -s ? 1 - Math.abs(yaw) * 0.22 : 1;
    const ex = cx + s * b.gap / 2 * squeeze + lx, ey = cy + ly;
    const ew = w * far, h = h0 * pose.open * (1 - blink);
    if (pose.open === 0 || h < 1.6) {
      // Closed: a cut-out arc, the ends turned down.
      eyes += `<path d="M${f(ex - ew * 0.75)} ${f(ey)} Q${f(ex)} ${f(ey - 4)} ${f(ex + ew * 0.75)} ${f(ey)}" fill="none" stroke="#000" stroke-width="3.2" stroke-linecap="round"/>`;
    } else {
      eyes += `<rect x="${f(ex - ew / 2)}" y="${f(ey - h / 2)}" width="${f(ew)}" height="${f(h)}" rx="${f(Math.min(ew, h) / 2)}" fill="#000"/>`;
    }
  });
  const t = `translate(0 ${pose.ty}) rotate(${pose.rot} 50 60) translate(50 76) scale(${f(squeeze * 0.06 + 0.94 + (1 - squeeze) * 0)} ${pose.sy}) translate(-50 -76)`;
  return `<svg viewBox="0 0 100 100" role="img" aria-label="${b.name}">
    <defs><mask id="${id}" maskUnits="userSpaceOnUse" x="-20" y="-20" width="140" height="140"><rect x="-20" y="-20" width="140" height="140" fill="#fff"/>${eyes}</mask></defs>
    <g transform="${t}"><g mask="url(#${id})"><path d="${b.d}" fill="${HI}"/>${b.extra ? `<path d="${b.extra}" fill="${HI}" opacity=".55"/>` : ''}</g></g></svg>`;
}

const grid = document.getElementById('grid');
BODIES.forEach((b, i) => {
  const art = document.createElement('article');
  art.innerHTML = `<h2><span>${i + 1}</span>${b.name}</h2>
    <div class="stage" data-i="${i}">${mascot(b, POSE.idle)}</div>
    <div class="states">${STATES.map(s => `<figure><div class="tile">${mascot(b, POSE[s])}</div><figcaption>${s}</figcaption></figure>`).join('')}</div>
    <div class="island">${mascot(b, POSE.idle)}<div class="ears">${STATES.map(s => mascot(b, POSE[s])).join('')}</div></div>`;
  grid.append(art);
});
// At notch size each body fills the 20 pt height instead of sitting small inside its square.
document.querySelectorAll('.island svg').forEach(svg => {
  const bb = svg.querySelector('g[mask] path').getBBox(), pad = 3;
  svg.setAttribute('viewBox', `${bb.x - pad} ${bb.y - pad} ${bb.width + pad * 2} ${bb.height + pad * 2}`);
  svg.style.width = (20 * (bb.width + pad * 2) / (bb.height + pad * 2)).toFixed(1) + 'px';
});

// Alive, not looping: blinks and glances come at random times; a click is a small poke.
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (!reduce) document.querySelectorAll('.stage').forEach(stage => {
  const b = BODIES[+stage.dataset.i];
  let yaw = 0, vel = 0, target = 0, blink = 0, blinkUntil = 0, poke = 0;
  let nextBlink = performance.now() + 1500 + Math.random() * 3000, nextGlance = performance.now() + 2000 + Math.random() * 3000;
  stage.addEventListener('click', () => { poke = 1; blinkUntil = performance.now() + 140; });
  const tick = now => {
    if (now > nextBlink) { blinkUntil = now + 130; nextBlink = now + 2200 + Math.random() * 4500; }
    if (now > nextGlance) { target = Math.random() < 0.35 ? 0 : (Math.random() * 2 - 1); nextGlance = now + 1400 + Math.random() * 3200; if (Math.random() < 0.5) blinkUntil = now + 120; }
    // A spring with a little overshoot moves the face.
    const k = 0.012, c = 0.2; vel += (target - yaw) * k * 16 - vel * c; yaw += vel;
    blink = now < blinkUntil ? 1 : Math.max(0, blink - 0.25);
    poke *= 0.88;
    const pose = { ...POSE.idle, sy: 1 - poke * 0.1, ty: poke * 4, look: [0, 0] };
    stage.innerHTML = mascot(b, pose, { blink, yaw: Math.max(-1, Math.min(1, yaw)) });
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
});
</script>
</body>
</html>
